[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true  # Required for FHE operations
optimizer = true
optimizer_runs = 200
solc_version = "0.8.25"

# Remappings for dependencies
remappings = [
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@fhenixprotocol/cofhe-contracts/=lib/cofhe-contracts/contracts/",
    "@fhenixprotocol/cofhe-mock-contracts/=lib/cofhe-mock-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# RPC endpoints
[rpc_endpoints]
mainnet = "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_KEY}"
sepolia = "https://eth-sepolia.alchemyapi.io/v2/${ALCHEMY_KEY}"
fhenix = "https://api.helium.fhenix.zone"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
